<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCC wasm32 WAT Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #171b22;
      --muted: #687180;
      --line: #d8dde5;
      --line-strong: #b9c1ce;
      --accent: #176b5f;
      --accent-strong: #0f5148;
      --bad: #a12f2f;
      --code-bg: #101418;
      --code-ink: #e6ebf2;
      --code-muted: #aab4c2;
      --shadow: 0 1px 2px rgba(22, 29, 37, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    select {
      padding: 0 28px 0 9px;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 210px;
    }

    .brand strong {
      font-size: 16px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(280px, 42%) minmax(0, 1fr);
      min-height: 0;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 37px minmax(0, 1fr);
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .pane:last-child {
      border-right: 0;
    }

    .pane-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      color: #333b47;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      text-overflow: ellipsis;
      text-transform: none;
      white-space: nowrap;
    }

    .status.error {
      color: var(--bad);
    }

    textarea,
    pre {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 4;
    }

    textarea {
      resize: none;
      padding: 14px;
      outline: none;
      color: #18202b;
      background: #fbfcfe;
    }

    pre {
      overflow: auto;
      padding: 14px;
      color: var(--code-ink);
      background: var(--code-bg);
      white-space: pre;
    }

    pre.empty {
      color: var(--code-muted);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      padding: 6px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
    }

    .footer code {
      color: #344051;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 9px;
      }

      .brand {
        min-width: 0;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .split {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(280px, 46vh) minmax(280px, 1fr);
      }

      .pane {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <strong>TCC wasm32 WAT Explorer</strong>
        <span>C to WebAssembly text</span>
      </div>
      <div class="toolbar">
        <select id="exampleSelect" aria-label="Example">
          <option value="fib">fib</option>
          <option value="pointers">pointers</option>
          <option value="duff">Duff's device</option>
        </select>
        <button id="copyButton" type="button" title="Copy WAT">Copy</button>
        <button id="compileButton" class="primary" type="button">Compile</button>
      </div>
    </header>

    <section class="split" aria-label="Compiler panes">
      <section class="pane">
        <div class="pane-title">
          <span>C Source</span>
        </div>
        <textarea id="source" spellcheck="false"></textarea>
      </section>

      <section class="pane">
        <div class="pane-title">
          <span>WAT Output</span>
          <span id="statusText" class="status">Loading compiler...</span>
        </div>
        <pre id="output" class="empty">The in-browser TCC compiler is loading.</pre>
      </section>
    </section>

    <footer class="footer">
      <span>Compiler: <code>tcc_compile_file("/input.c", "/out.wat")</code></span>
      <span>Target: experimental <code>TCC_TARGET_WASM32</code>, freestanding WAT</span>
    </footer>
  </main>

  <script>
    const examples = {
      fib: `int fib(int n) {
    if (n < 2)
        return n;
    return fib(n - 1) + fib(n - 2);
}

int main(void) {
    return fib(10);
}
`,
      pointers: `int sum(int *p, int n) {
    int i;
    int r = 0;
    for (i = 0; i < n; ++i)
        r += p[i];
    return r;
}

int main(void) {
    int values[4] = { 3, 5, 8, 13 };
    return sum(values, 4);
}
`,
      duff: `void copy8(char *to, const char *from, int count) {
    int n = (count + 7) / 8;

    switch (count % 8) {
    case 0: do { *to++ = *from++;
    case 7:      *to++ = *from++;
    case 6:      *to++ = *from++;
    case 5:      *to++ = *from++;
    case 4:      *to++ = *from++;
    case 3:      *to++ = *from++;
    case 2:      *to++ = *from++;
    case 1:      *to++ = *from++;
            } while (--n > 0);
    }
}

int main(void) {
    char src[11] = "hello wasm";
    char dst[11];
    copy8(dst, src, 11);
    return dst[6];
}
`
    };

    const sourceEl = document.getElementById("source");
    const outputEl = document.getElementById("output");
    const statusEl = document.getElementById("statusText");
    const compileButton = document.getElementById("compileButton");
    const copyButton = document.getElementById("copyButton");
    const exampleSelect = document.getElementById("exampleSelect");
    let compilerReady = false;
    let compilerLog = [];

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", Boolean(isError));
    }

    function setOutput(text, isEmpty) {
      outputEl.textContent = text;
      outputEl.classList.toggle("empty", Boolean(isEmpty));
    }

    function replaceExample(name) {
      sourceEl.value = examples[name] || examples.fib;
    }

    function unlinkIfExists(path) {
      try {
        Module.FS.unlink(path);
      } catch (e) {
      }
    }

    function compileSource() {
      if (!compilerReady)
        return;

      compilerLog = [];
      compileButton.disabled = true;
      setStatus("Compiling...");

      try {
        Module.FS.writeFile("/input.c", sourceEl.value);
        unlinkIfExists("/out.wat");
        const rc = Module.ccall(
          "tcc_compile_file",
          "number",
          ["string", "string"],
          ["/input.c", "/out.wat"]
        );

        if (rc === 0) {
          const wat = Module.FS.readFile("/out.wat", { encoding: "utf8" });
          setOutput(wat, false);
          setStatus("Compiled");
        } else {
          const text = compilerLog.join("\\n") || "Compilation failed.";
          setOutput(text, false);
          setStatus("Compile failed", true);
        }
      } catch (e) {
        setOutput(e && e.stack ? e.stack : String(e), false);
        setStatus("Runtime error", true);
      } finally {
        compileButton.disabled = false;
      }
    }

    var Module = {
      noInitialRun: true,
      print(text) {
        compilerLog.push(String(text));
        console.log(text);
      },
      printErr(text) {
        compilerLog.push(String(text));
        console.error(text);
      },
      onRuntimeInitialized() {
        compilerReady = true;
        compileButton.disabled = false;
        setStatus("Ready");
        compileSource();
      }
    };

    compileButton.disabled = true;
    replaceExample("fib");
    exampleSelect.addEventListener("change", () => {
      replaceExample(exampleSelect.value);
      compileSource();
    });
    compileButton.addEventListener("click", compileSource);
    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(outputEl.textContent);
      setStatus("Copied");
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
