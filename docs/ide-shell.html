<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCC Wasm IDE</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #171b22;
      --code-font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --code-padding: 12px;
      --code-tab-size: 4;
      --code-gutter-width: 46px;
      --code-assist-width: 310px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      border-bottom: 1px solid #d8dde6;
      background: #fff;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #status {
      min-width: 120px;
      text-align: right;
      font-size: 13px;
      color: #4b5563;
    }

    #status.error {
      color: #b42318;
    }

    button {
      border: 1px solid #1f6feb;
      border-radius: 6px;
      background: #1f6feb;
      color: #fff;
      height: 32px;
      padding: 0 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      border-color: #b9c2d0;
      background: #fff;
      color: #111827;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
      min-height: 0;
    }

    .left,
    .right {
      display: grid;
      min-width: 0;
      min-height: 0;
    }

    .left {
      grid-template-rows: auto 1fr;
      border-right: 1px solid #d8dde6;
    }

    .right {
      grid-template-rows: minmax(150px, .42fr) minmax(180px, .58fr);
    }

    .pane {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }

    .right .pane:first-child {
      border-bottom: 1px solid #d8dde6;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 11px;
      border-bottom: 1px solid #d8dde6;
      background: #fbfcfe;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-height: 0;
    }

    .split .pane:first-child {
      border-right: 1px solid #d8dde6;
    }

    textarea {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 12px;
      border: 0;
      outline: 0;
      resize: none;
      overflow: auto;
      background: #fff;
      color: #111827;
      font: var(--code-font);
      tab-size: var(--code-tab-size);
      white-space: pre;
    }

    textarea[readonly] {
      background: #fcfdff;
    }

    .code-editor {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }

    .code-editor-line-highlight {
      position: absolute;
      left: var(--code-gutter-width);
      right: 0;
      top: 0;
      z-index: 0;
      height: 18px;
      pointer-events: none;
      background: #eaf4ff;
    }

    .code-editor-gutter {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 4;
      width: var(--code-gutter-width);
      overflow: hidden;
      border-right: 1px solid #d8dde6;
      background: #f3f6fa;
      color: #6b7280;
      font: var(--code-font);
      tab-size: var(--code-tab-size);
      user-select: none;
    }

    .code-editor-line-numbers {
      min-height: 100%;
      padding: var(--code-padding) 8px var(--code-padding) 0;
      text-align: right;
      white-space: pre;
    }

    .code-editor-line-numbers span {
      display: block;
      height: 1.45em;
    }

    .code-editor-line-numbers span.active {
      color: #111827;
      font-weight: 700;
    }

    .code-editor:focus-within {
      box-shadow: inset 0 0 0 2px rgba(31, 111, 235, .24);
    }

    .code-editor-highlight {
      position: absolute;
      inset: 0;
      z-index: 1;
      margin: 0;
      border: 0;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
      color: #111827;
      font: var(--code-font);
      tab-size: var(--code-tab-size);
      white-space: pre;
    }

    .code-editor-code {
      display: block;
      min-width: max-content;
      min-height: 100%;
      padding: var(--code-padding);
      padding-left: calc(var(--code-gutter-width) + var(--code-padding));
      white-space: pre;
      font: inherit;
      tab-size: inherit;
    }

    .code-editor-input {
      position: absolute;
      inset: 0;
      z-index: 3;
      padding-left: calc(var(--code-gutter-width) + var(--code-padding));
      background: transparent;
      color: transparent;
      caret-color: #111827;
      -webkit-text-fill-color: transparent;
    }

    .code-editor-input::selection {
      background: rgba(31, 111, 235, .22);
      color: transparent;
    }

    .code-editor-popup,
    .code-editor-hint {
      position: absolute;
      z-index: 5;
      width: min(var(--code-assist-width), calc(100% - var(--code-gutter-width) - 12px));
      border: 1px solid #aeb8c7;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(15, 23, 42, .18);
      font: 12px/1.35 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .code-editor-popup[hidden],
    .code-editor-hint[hidden] {
      display: none;
    }

    .code-editor-popup {
      max-height: 216px;
      overflow: auto;
      padding: 4px;
    }

    .code-editor-completion {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 26px;
      padding: 4px 7px;
      border-radius: 4px;
      color: #111827;
      cursor: default;
    }

    .code-editor-completion.active {
      background: #1f6feb;
      color: #fff;
    }

    .code-editor-completion-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .code-editor-completion-kind {
      color: #64748b;
      font-size: 11px;
    }

    .code-editor-completion.active .code-editor-completion-kind {
      color: rgba(255, 255, 255, .78);
    }

    .code-editor-hint {
      padding: 8px 9px;
      color: #263241;
    }

    .code-editor-hint-signature {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: var(--code-font);
      font-weight: 700;
      color: #111827;
    }

    .code-editor-hint-detail {
      margin-top: 3px;
      color: #4b5563;
    }

    .code-editor-measure {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      white-space: pre;
      font: var(--code-font);
      tab-size: var(--code-tab-size);
    }

    .tok-comment {
      color: #5f6f52;
      font-style: italic;
    }

    .tok-keyword {
      color: #0f62b8;
      font-weight: 700;
    }

    .tok-type {
      color: #8a4f12;
      font-weight: 650;
    }

    .tok-string {
      color: #a43c32;
    }

    .tok-number {
      color: #0b6f73;
    }

    .tok-preprocessor {
      color: #6f4aa8;
      font-weight: 650;
    }

    .tok-function {
      color: #244f8f;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(360px, 1fr) minmax(360px, 1fr);
      }

      .left {
        border-right: 0;
        border-bottom: 1px solid #d8dde6;
      }
    }

    @media (max-width: 620px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: space-between;
      }

      #status {
        text-align: left;
      }

      .split {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .split .pane:first-child {
        border-right: 0;
        border-bottom: 1px solid #d8dde6;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">TCC Wasm IDE</div>
      <div class="actions">
        <button id="compile" disabled>Compile</button>
        <button id="run" disabled>Run</button>
        <button id="reset" class="secondary">Reset</button>
        <span id="status">Loading</span>
      </div>
    </header>
    <main>
      <section class="left">
        <div class="bar">
          <span>C</span>
          <span id="binary-size"></span>
        </div>
        <textarea id="source" spellcheck="false"></textarea>
      </section>
      <section class="right">
        <div class="split">
          <section class="pane">
            <div class="bar"><span>stdin</span></div>
            <textarea id="stdin" spellcheck="false"></textarea>
          </section>
          <section class="pane">
            <div class="bar"><span>stdout</span><span id="return-code"></span></div>
            <textarea id="stdout" readonly spellcheck="false"></textarea>
          </section>
        </div>
        <section class="pane">
          <div class="bar"><span>WAT</span></div>
          <textarea id="wat" readonly spellcheck="false"></textarea>
        </section>
      </section>
    </main>
  </div>

  <script src="./ide-resources.js"></script>
  <script src="./runtime.js"></script>
  <script src="./editor.js"></script>
  <script>
    const defaultSource = `#include <stdio.h>

int main(void)
{
    int a = 0;
    int b = 0;
    if (scanf("%d %d", &a, &b) != 2)
        return 1;
    printf("%d\\n", a + b);
    return 0;
}
`;

    const defaultStdin = "2 40\n";
    const statusEl = document.getElementById("status");
    const sourceEl = document.getElementById("source");
    const stdinEl = document.getElementById("stdin");
    const stdoutEl = document.getElementById("stdout");
    const watEl = document.getElementById("wat");
    const compileButton = document.getElementById("compile");
    const runButton = document.getElementById("run");
    const resetButton = document.getElementById("reset");
    const binarySizeEl = document.getElementById("binary-size");
    const returnCodeEl = document.getElementById("return-code");
    const sourceEditor = TccWasmEditor.createCodeEditor(sourceEl);

    let compiler;
    let appRuntime;
    let wabtPromise;
    let compiledWat = "";
    let compiledBinary = null;
    let compiledModule = null;

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", Boolean(isError));
    }

    function invalidateBuild(status) {
      compiledWat = "";
      compiledBinary = null;
      compiledModule = null;
      watEl.value = "";
      binarySizeEl.textContent = "";
      returnCodeEl.textContent = "";
      runButton.disabled = true;
      if (status)
        setStatus(status);
    }

    async function loadWabt() {
      if (!wabtPromise) {
        wabtPromise = new Promise((resolve, reject) => {
          if (globalThis.WabtModule) {
            globalThis.WabtModule().then(resolve, reject);
            return;
          }
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/wabt@1.0.37/index.js";
          script.onload = () => globalThis.WabtModule().then(resolve, reject);
          script.onerror = () => reject(new Error("could not load WABT"));
          document.head.appendChild(script);
        });
      }
      return wabtPromise;
    }

    function formatWatPane(result) {
      const diagnostics = (result.diagnostics || "").trim();
      if (!diagnostics)
        return result.wat;
      const warningLines = diagnostics.split(/\r?\n/)
        .map(line => `;; ${line}`)
        .join("\n");
      return `;; Compiler diagnostics\n${warningLines}\n\n${result.wat}`;
    }

    function compileToWat() {
      return compiler.compileAppResult(sourceEl.value);
    }

    async function assembleWat(wat) {
      const wabt = await loadWabt();
      const features = {
        exceptions: true,
        mutable_globals: true,
        sat_float_to_int: true,
        sign_extension: true,
        multi_value: true,
        bulk_memory: true,
        reference_types: true
      };
      const module = wabt.parseWat("input.wat", wat, features);
      try {
        module.resolveNames();
        module.validate();
        return module.toBinary({ write_debug_names: true }).buffer;
      } finally {
        module.destroy();
      }
    }

    async function compile() {
      compileButton.disabled = true;
      runButton.disabled = true;
      returnCodeEl.textContent = "";
      binarySizeEl.textContent = "";
      setStatus("Compiling");
      const result = compileToWat();
      compiledWat = result.wat;
      watEl.value = formatWatPane(result);
      setStatus("Assembling");
      compiledBinary = await assembleWat(compiledWat);
      compiledModule = await WebAssembly.compile(compiledBinary);
      binarySizeEl.textContent = `${compiledBinary.length} bytes`;
      runButton.disabled = false;
      setStatus("Compiled");
      compileButton.disabled = false;
    }

    async function runProgram() {
      if (!compiledModule)
        await compile();
      runButton.disabled = true;
      stdoutEl.value = "";
      returnCodeEl.textContent = "";
      setStatus("Running");
      const result = await appRuntime.run(compiledModule, { stdin: stdinEl.value });
      stdoutEl.value = result.stderr ? `${result.stdout}\n[stderr]\n${result.stderr}` : result.stdout;
      stdoutEl.scrollTop = stdoutEl.scrollHeight;
      returnCodeEl.textContent = `rc ${result.rc}`;
      setStatus("Ran");
      runButton.disabled = false;
    }

    async function boot() {
      sourceEl.value = defaultSource;
      sourceEditor.refresh();
      stdinEl.value = defaultStdin;
      [compiler, appRuntime] = await Promise.all([
        TccWasmRuntime.CompilerHost.create({
          wasm: "./tcc.wasm",
          libc: "./libc.wasm",
          resources: TccWasmIdeResources
        }),
        TccWasmRuntime.AppRuntime.create({ libc: "./libc.wasm" })
      ]);
      compileButton.disabled = false;
      setStatus("Ready");
      await compile();
    }

    compileButton.addEventListener("click", () => {
      compile().catch(err => {
        watEl.value = err && err.stack ? err.stack : String(err);
        setStatus("Compile failed", true);
        compileButton.disabled = false;
      });
    });

    runButton.addEventListener("click", () => {
      runProgram().catch(err => {
        stdoutEl.value = err && err.stack ? err.stack : String(err);
        setStatus("Run failed", true);
        runButton.disabled = false;
      });
    });

    resetButton.addEventListener("click", () => {
      sourceEl.value = defaultSource;
      sourceEditor.refresh();
      stdinEl.value = defaultStdin;
      stdoutEl.value = "";
      invalidateBuild("Reset");
    });

    sourceEl.addEventListener("input", () => {
      invalidateBuild("Edited");
    });

    boot().catch(err => {
      watEl.value = err && err.stack ? err.stack : String(err);
      setStatus("Load failed", true);
    });
  </script>
</body>
</html>
